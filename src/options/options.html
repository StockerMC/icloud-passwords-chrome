<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>iCloud Passwords for Chrome</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: auto; max-width: 480px; margin: 24px auto; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    select { font: inherit; padding: 4px 8px; }
    .help { margin-top: 8px; }
  </style>
</head>
<body>
  <section class="view">
    <label for="remember">Remember a password after reading it</label>
    <select id="remember">
      <option value="0">Off</option>
      <option value="1">1 minute</option>
      <option value="5">5 minutes</option>
      <option value="15">15 minutes</option>
    </select>
    <p class="help muted">
      macOS asks for Touch ID each time a password is read. Remembering it lets
      the same login fill again without a prompt. It is held in memory only and
      dropped when you lock or restart the browser.
    </p>
  </section>
  <script type="module" src="options.js"></script>
</body>
</html>
